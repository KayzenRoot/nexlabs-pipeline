name: docs-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: docs-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python version
        run: python3 --version
      - name: Validate Source Pack
        run: python3 scripts/validate_sources.py
      - name: Run canonical tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile offline registry and dry-run plan
        run: python3 -m registry verify
      - name: Security regression scan
        run: python3 scripts/security/scan_repository.py
