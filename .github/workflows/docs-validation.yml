name: docs-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: docs-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python version
        run: python3 --version
      - name: Validate Source Pack
        run: python3 scripts/validate_sources.py
      - name: Run canonical tests
        run: python3 -m unittest discover -s tests -v
